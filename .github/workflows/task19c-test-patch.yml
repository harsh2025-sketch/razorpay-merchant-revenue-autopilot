name: Task 19C API expectation patch

on:
  push:
    branches: [task19c/champion-challenger]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[task19c-api-test-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: task19c/champion-challenger
      - name: Update KEEP audit expectation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/tests/test_api.py')
          text = path.read_text()
          old = '''    expected_experiment_events = [
                  "EXPERIMENT_PLANNED",
                  "POLICY_APPROVED",
                  "RAZORPAY_RESOURCE_CREATED",
                  "EXPERIMENT_STARTED",
                  "EXPERIMENT_COMPLETED",
              ]
              if result["decision"] == "ROLLBACK":
                  expected_experiment_events += [
                      "RAZORPAY_RESOURCE_CANCELLED",
                      "EXPERIMENT_ROLLED_BACK",
                  ]
          '''
          new = '''    expected_experiment_events = [
                  "EXPERIMENT_PLANNED",
                  "POLICY_APPROVED",
                  "RAZORPAY_RESOURCE_CREATED",
                  "EXPERIMENT_STARTED",
                  "EXPERIMENT_COMPLETED",
              ]
              if result["decision"] == "KEEP":
                  expected_experiment_events.append("TREATMENT_PROMOTED")
              if result["decision"] == "ROLLBACK":
                  expected_experiment_events += [
                      "RAZORPAY_RESOURCE_CANCELLED",
                      "EXPERIMENT_ROLLED_BACK",
                  ]
          '''
          if old not in text:
              raise SystemExit('test_api audit expectation marker not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit regression update
        run: |
          git config user.name "Harsh Dinodia"
          git config user.email "ghosttalk719@gmail.com"
          git add backend/tests/test_api.py
          git diff --cached --check
          git commit -m "test: expect champion promotion audit on KEEP [task19c-api-test-patched]"
          git push origin HEAD:task19c/champion-challenger
