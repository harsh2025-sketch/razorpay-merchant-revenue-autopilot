name: Task 19C focused integration patch

on:
  push:
    branches: [task19c/champion-challenger]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[task19c-integrated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: task19c/champion-challenger

      - name: Patch planner and statistics boundaries
        run: |
          python - <<'PY'
          from pathlib import Path

          planner = Path('backend/app/engines/planner.py')
          text = planner.read_text()
          import_marker = '''from app.schemas.hypothesis import (
              EXPIRY_MAX_HOURS,
              INTERVENTION_TYPE_SET,
              OFFER_DISCOUNT_MAX_PCT,
              PARTIAL_PAYMENT_MIN_MAX_PCT,
              PAYMENT_METHOD_KEYS,
          )
          '''
          champion_import = '''from app.services.champion import champion_control_config
          '''
          if champion_import.strip() not in text:
              if import_marker not in text:
                  raise SystemExit('planner import marker not found')
              text = text.replace(import_marker, import_marker + champion_import, 1)

          old_tail = '''    plan = build_experiment_plan(hypothesis=hypothesis, opportunity=opportunity)
              return persist_experiment_plan(db, plan)
          '''
          new_tail = '''    plan = build_experiment_plan(hypothesis=hypothesis, opportunity=opportunity)
              champion_control, _champion_version, _champion_source = champion_control_config(
                  db,
                  merchant_id=hypothesis.merchant_id,
                  intervention_type=plan.intervention_type,
                  fallback_control=dict(plan.control_config),
              )
              if dict(plan.treatment_config) == champion_control:
                  raise ExperimentPlanningError(
                      "challenger configuration is identical to current champion"
                  )
              if dict(plan.control_config) != champion_control:
                  plan = plan.model_copy(update={"control_config": champion_control})
              return persist_experiment_plan(db, plan)
          '''
          if old_tail not in text:
              raise SystemExit('planner persistence tail marker not found')
          text = text.replace(old_tail, new_tail, 1)
          planner.write_text(text)

          stats = Path('backend/app/engines/statistics.py')
          text = stats.read_text()
          audit_import = '''from app.services.audit import (
              ACTOR_STATISTICS,
              ENTITY_EXPERIMENT,
              EXPERIMENT_COMPLETED,
              record_audit_event_once,
          )
          '''
          audit_replacement = '''from app.services.audit import (
              ACTOR_STATISTICS,
              ENTITY_EXPERIMENT,
              EXPERIMENT_COMPLETED,
              TREATMENT_PROMOTED,
              record_audit_event_once,
          )
          from app.services.champion import get_merchant_champion_state
          '''
          if audit_import not in text:
              raise SystemExit('statistics audit import marker not found')
          text = text.replace(audit_import, audit_replacement, 1)

          return_marker = '''    record_audit_event_once(
                  db,
                  merchant_id=experiment.merchant_id,
                  event_type=EXPERIMENT_COMPLETED,
                  entity_type=ENTITY_EXPERIMENT,
                  entity_id=experiment.id,
                  data={
                      "decision": evaluation.decision,
                      "p_value": evaluation.p_value,
                      "absolute_lift": evaluation.absolute_lift,
                      "control_rate": evaluation.control_rate,
                      "treatment_rate": evaluation.treatment_rate,
                  },
                  actor=ACTOR_STATISTICS,
              )
              return result
          '''
          replacement = '''    record_audit_event_once(
                  db,
                  merchant_id=experiment.merchant_id,
                  event_type=EXPERIMENT_COMPLETED,
                  entity_type=ENTITY_EXPERIMENT,
                  entity_id=experiment.id,
                  data={
                      "decision": evaluation.decision,
                      "p_value": evaluation.p_value,
                      "absolute_lift": evaluation.absolute_lift,
                      "control_rate": evaluation.control_rate,
                      "treatment_rate": evaluation.treatment_rate,
                  },
                  actor=ACTOR_STATISTICS,
              )
              if evaluation.decision == "KEEP":
                  champion = get_merchant_champion_state(db, experiment.merchant_id)
                  record_audit_event_once(
                      db,
                      merchant_id=experiment.merchant_id,
                      event_type=TREATMENT_PROMOTED,
                      entity_type=ENTITY_EXPERIMENT,
                      entity_id=experiment.id,
                      data={
                          "champion_version": champion.version,
                          "intervention_type": experiment.intervention_type,
                          "source_experiment_id": experiment.id,
                          "absolute_lift": evaluation.absolute_lift,
                          "p_value": evaluation.p_value,
                      },
                      actor=ACTOR_STATISTICS,
                  )
              return result
          '''
          if return_marker not in text:
              raise SystemExit('statistics completion marker not found')
          text = text.replace(return_marker, replacement, 1)
          stats.write_text(text)
          PY

          git diff --check

      - name: Commit focused integration
        run: |
          git config user.name "Harsh Dinodia"
          git config user.email "ghosttalk719@gmail.com"
          git add backend/app/engines/planner.py backend/app/engines/statistics.py
          git diff --cached --check
          git commit -m "feat: wire champion challenger planning and promotion audit [task19c-integrated]"
          git push origin HEAD:task19c/champion-challenger
