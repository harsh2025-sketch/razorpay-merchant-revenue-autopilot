name: Task 19E build

on:
  push:
    branches: [task19e/merchant-intelligence]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[task19e-built]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: task19e/merchant-intelligence

      - name: Apply Merchant Intelligence backend and frontend
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'marker not found in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          # -----------------------------------------------------------------
          # Backend aggregate read model
          # -----------------------------------------------------------------
          replace_once(
              'backend/app/services/autopilot.py',
              'from app.services.portfolio import build_opportunity_portfolio\n',
              'from app.services.portfolio import build_opportunity_portfolio\n'
              'from app.services.champion import get_merchant_champion_state\n'
              'from app.services.memory import get_merchant_experiment_memory\n',
          )

          overview_end = '''    return {\n        "merchant": merchant_summary(db, merchant_id),\n        "metrics": asdict(metrics),\n        # Observable breakdowns come straight from the existing Task 07\n        # metric engine; no trend, weakest-segment or revenue-at-risk value\n        # is derived on top of them.\n        "segment_metrics": get_segment_metrics(db, merchant_id),\n        "payment_method_metrics": get_payment_method_metrics(db, merchant_id),\n        "attempted_gmv_paise": attempted_gmv,\n        "captured_gmv_paise": captured_gmv,\n        "active_opportunity_count": int(active_opportunity_count or 0),\n        "active_experiment_count": int(active_experiment_count or 0),\n        "latest_experiment": experiment,\n        "latest_result": result,\n        "audit_chain_valid": verify_merchant_audit_chain(db, merchant_id),\n        "autopilot_status": autopilot_status(db, merchant_id),\n    }\n\n\n'''
          intelligence_fn = '''    return {\n        "merchant": merchant_summary(db, merchant_id),\n        "metrics": asdict(metrics),\n        # Observable breakdowns come straight from the existing Task 07\n        # metric engine; no trend, weakest-segment or revenue-at-risk value\n        # is derived on top of them.\n        "segment_metrics": get_segment_metrics(db, merchant_id),\n        "payment_method_metrics": get_payment_method_metrics(db, merchant_id),\n        "attempted_gmv_paise": attempted_gmv,\n        "captured_gmv_paise": captured_gmv,\n        "active_opportunity_count": int(active_opportunity_count or 0),\n        "active_experiment_count": int(active_experiment_count or 0),\n        "latest_experiment": experiment,\n        "latest_result": result,\n        "audit_chain_valid": verify_merchant_audit_chain(db, merchant_id),\n        "autopilot_status": autopilot_status(db, merchant_id),\n    }\n\n\ndef merchant_intelligence(db: Session, merchant_id: str) -> dict[str, Any]:\n    """Explain what Autopilot currently prioritizes and has learned.\n\n    This is a pure read model over Tasks 19A-19C. It does not create a new\n    source of truth: opportunity priority comes from the deterministic\n    portfolio service, learned history comes from terminal experiment memory,\n    and champion state is reconstructed only from persisted KEEP results.\n    """\n    get_merchant(db, merchant_id)\n    portfolio = build_opportunity_portfolio(db, merchant_id)\n    champion = get_merchant_champion_state(db, merchant_id)\n    memory = get_merchant_experiment_memory(db, merchant_id)\n\n    return {\n        "merchant": merchant_summary(db, merchant_id),\n        "portfolio": {\n            "merchant_id": portfolio.merchant_id,\n            "next_best_opportunity_id": portfolio.next_best_opportunity_id,\n            "opportunities": [asdict(row) for row in portfolio.opportunities],\n        },\n        "champion": {\n            "merchant_id": champion.merchant_id,\n            "version": champion.version,\n            "promotion_count": champion.promotion_count,\n            "latest_promotion_experiment_id": champion.latest_promotion_experiment_id,\n            "configs": [asdict(row) for row in champion.configs],\n        },\n        "memory": {\n            "merchant_id": memory.merchant_id,\n            "trial_count": memory.trial_count,\n            "completed_result_count": memory.completed_result_count,\n            "policy_rejection_count": memory.policy_rejection_count,\n            "keep_count": memory.keep_count,\n            "rollback_count": memory.rollback_count,\n            "inconclusive_count": memory.inconclusive_count,\n            "knowledge": [asdict(row) for row in memory.knowledge],\n            # Memory is built oldest-first for deterministic aggregation. The\n            # dashboard consumes terminal history newest-first.\n            "records": [asdict(row) for row in reversed(memory.records)],\n        },\n    }\n\n\n'''
          replace_once('backend/app/services/autopilot.py', overview_end, intelligence_fn)

          # -----------------------------------------------------------------
          # Backend strict response schemas
          # -----------------------------------------------------------------
          schema_marker = '''class AutopilotStepResponse(ApiModel):\n'''
          intelligence_schemas = '''class RankedOpportunityIntelligenceResponse(ApiModel):\n    rank: int\n    opportunity_id: str\n    segment: str\n    status: str\n    detector_severity: float\n    detected_conversion_rate: float | None = None\n    comparison_conversion_rate: float | None = None\n    conversion_gap: float\n    segment_attempts: int\n    average_captured_order_value_paise: float | None = None\n    estimated_incremental_captures: float\n    #: Existing Task 19B sizing proxy. It is not a forecast or booked revenue.\n    estimated_recoverable_gmv_paise: int | None = None\n    prior_terminal_trials: int\n    history_factor: float\n    allowed_intervention_count: int\n    previously_tried_interventions: list[str] = Field(default_factory=list)\n    untried_allowed_interventions: list[str] = Field(default_factory=list)\n    policy_feasible: bool\n    history_adjusted_gmv_proxy_paise: int | None = None\n    priority_index: float\n\n\nclass OpportunityPortfolioIntelligenceResponse(ApiModel):\n    merchant_id: str\n    next_best_opportunity_id: str | None = None\n    opportunities: list[RankedOpportunityIntelligenceResponse] = Field(default_factory=list)\n\n\nclass ChampionConfigIntelligenceResponse(ApiModel):\n    intervention_type: str\n    config: dict[str, Any] = Field(default_factory=dict)\n    source_experiment_id: str\n    promoted_at: datetime\n    absolute_lift: float\n    p_value: float\n\n\nclass MerchantChampionIntelligenceResponse(ApiModel):\n    merchant_id: str\n    version: int\n    promotion_count: int\n    configs: list[ChampionConfigIntelligenceResponse] = Field(default_factory=list)\n    latest_promotion_experiment_id: str | None = None\n\n\nclass InterventionKnowledgeResponse(ApiModel):\n    segment: str\n    intervention_type: str\n    trial_count: int\n    approved_count: int\n    rejected_count: int\n    completed_result_count: int\n    keep_count: int\n    rollback_count: int\n    inconclusive_count: int\n    latest_outcome: str\n    latest_experiment_id: str\n    latest_treatment_config: dict[str, Any] = Field(default_factory=dict)\n    latest_treatment_config_fingerprint: str\n    latest_absolute_lift: float | None = None\n    latest_p_value: float | None = None\n\n\nclass ExperimentMemoryRecordResponse(ApiModel):\n    experiment_id: str\n    opportunity_id: str\n    segment: str\n    intervention_type: str\n    treatment_config: dict[str, Any] = Field(default_factory=dict)\n    treatment_config_fingerprint: str\n    experiment_status: str\n    policy_decision: Literal["APPROVE", "REJECT"] | None = None\n    policy_violations: list[str] = Field(default_factory=list)\n    statistical_decision: Literal["KEEP", "ROLLBACK", "INCONCLUSIVE"] | None = None\n    control_rate: float | None = None\n    treatment_rate: float | None = None\n    absolute_lift: float | None = None\n    relative_lift: float | None = None\n    p_value: float | None = None\n    confidence_interval_lower: float | None = None\n    confidence_interval_upper: float | None = None\n    is_significant: bool | None = None\n    treatment_resource_status: str | None = None\n    terminal_reason: str\n    created_at: datetime\n    started_at: datetime | None = None\n    ended_at: datetime | None = None\n\n\nclass MerchantExperimentMemoryResponse(ApiModel):\n    merchant_id: str\n    trial_count: int\n    completed_result_count: int\n    policy_rejection_count: int\n    keep_count: int\n    rollback_count: int\n    inconclusive_count: int\n    knowledge: list[InterventionKnowledgeResponse] = Field(default_factory=list)\n    records: list[ExperimentMemoryRecordResponse] = Field(default_factory=list)\n\n\nclass MerchantIntelligenceResponse(ApiModel):\n    """Read-only merchant intelligence assembled from persisted deterministic truth."""\n\n    merchant: MerchantSummary\n    portfolio: OpportunityPortfolioIntelligenceResponse\n    champion: MerchantChampionIntelligenceResponse\n    memory: MerchantExperimentMemoryResponse\n\n\nclass AutopilotStepResponse(ApiModel):\n'''
          replace_once('backend/app/api/schemas.py', schema_marker, intelligence_schemas)
          replace_once(
              'backend/app/api/schemas.py',
              '    "MerchantOverviewResponse",\n',
              '    "MerchantOverviewResponse",\n    "MerchantIntelligenceResponse",\n',
          )

          # -----------------------------------------------------------------
          # Backend route
          # -----------------------------------------------------------------
          route_marker = '''@router.get(\n    "/merchants/{merchant_id}/opportunities",\n'''
          intelligence_route = '''@router.get(\n    "/merchants/{merchant_id}/intelligence",\n    response_model=schemas.MerchantIntelligenceResponse,\n    responses=ERROR_RESPONSES,\n    tags=["merchant"],\n    summary="Portfolio, champion and learned experiment intelligence",\n)\ndef read_merchant_intelligence(\n    merchant_id: str, db: Session = Depends(get_db)\n) -> schemas.MerchantIntelligenceResponse:\n    return read_view(\n        db,\n        lambda: schemas.MerchantIntelligenceResponse.model_validate(\n            autopilot.merchant_intelligence(db, merchant_id)\n        ),\n    )\n\n\n@router.get(\n    "/merchants/{merchant_id}/opportunities",\n'''
          replace_once('backend/app/api/router.py', route_marker, intelligence_route)

          # -----------------------------------------------------------------
          # Frontend typed API surface
          # -----------------------------------------------------------------
          type_marker = '''export interface AutopilotStep {\n'''
          intelligence_types = '''export interface RankedOpportunityIntelligence {\n  rank: number;\n  opportunity_id: string;\n  segment: string;\n  status: string;\n  detector_severity: number;\n  detected_conversion_rate: number | null;\n  comparison_conversion_rate: number | null;\n  conversion_gap: number;\n  segment_attempts: number;\n  average_captured_order_value_paise: number | null;\n  estimated_incremental_captures: number;\n  estimated_recoverable_gmv_paise: number | null;\n  prior_terminal_trials: number;\n  history_factor: number;\n  allowed_intervention_count: number;\n  previously_tried_interventions: string[];\n  untried_allowed_interventions: string[];\n  policy_feasible: boolean;\n  history_adjusted_gmv_proxy_paise: number | null;\n  priority_index: number;\n}\n\nexport interface OpportunityPortfolioIntelligence {\n  merchant_id: string;\n  next_best_opportunity_id: string | null;\n  opportunities: RankedOpportunityIntelligence[];\n}\n\nexport interface ChampionConfigIntelligence {\n  intervention_type: string;\n  config: Record<string, unknown>;\n  source_experiment_id: string;\n  promoted_at: string;\n  absolute_lift: number;\n  p_value: number;\n}\n\nexport interface MerchantChampionIntelligence {\n  merchant_id: string;\n  version: number;\n  promotion_count: number;\n  configs: ChampionConfigIntelligence[];\n  latest_promotion_experiment_id: string | null;\n}\n\nexport interface InterventionKnowledge {\n  segment: string;\n  intervention_type: string;\n  trial_count: number;\n  approved_count: number;\n  rejected_count: number;\n  completed_result_count: number;\n  keep_count: number;\n  rollback_count: number;\n  inconclusive_count: number;\n  latest_outcome: string;\n  latest_experiment_id: string;\n  latest_treatment_config: Record<string, unknown>;\n  latest_treatment_config_fingerprint: string;\n  latest_absolute_lift: number | null;\n  latest_p_value: number | null;\n}\n\nexport interface ExperimentMemoryRecord {\n  experiment_id: string;\n  opportunity_id: string;\n  segment: string;\n  intervention_type: string;\n  treatment_config: Record<string, unknown>;\n  treatment_config_fingerprint: string;\n  experiment_status: string;\n  policy_decision: PolicyVerdict | null;\n  policy_violations: string[];\n  statistical_decision: StatisticalDecision | null;\n  control_rate: number | null;\n  treatment_rate: number | null;\n  absolute_lift: number | null;\n  relative_lift: number | null;\n  p_value: number | null;\n  confidence_interval_lower: number | null;\n  confidence_interval_upper: number | null;\n  is_significant: boolean | null;\n  treatment_resource_status: string | null;\n  terminal_reason: string;\n  created_at: string;\n  started_at: string | null;\n  ended_at: string | null;\n}\n\nexport interface MerchantExperimentMemory {\n  merchant_id: string;\n  trial_count: number;\n  completed_result_count: number;\n  policy_rejection_count: number;\n  keep_count: number;\n  rollback_count: number;\n  inconclusive_count: number;\n  knowledge: InterventionKnowledge[];\n  records: ExperimentMemoryRecord[];\n}\n\nexport interface MerchantIntelligence {\n  merchant: MerchantSummary;\n  portfolio: OpportunityPortfolioIntelligence;\n  champion: MerchantChampionIntelligence;\n  memory: MerchantExperimentMemory;\n}\n\nexport interface AutopilotStep {\n'''
          replace_once('frontend/lib/types.ts', type_marker, intelligence_types)

          replace_once(
              'frontend/lib/api.ts',
              '  MerchantOverview,\n',
              '  MerchantOverview,\n  MerchantIntelligence,\n',
          )
          replace_once(
              'frontend/lib/api.ts',
              '''export function getOpportunities(merchantId: string): Promise<Opportunity[]> {\n''',
              '''export function getMerchantIntelligence(\n  merchantId: string,\n): Promise<MerchantIntelligence> {\n  return request<MerchantIntelligence>(API_PATHS.intelligence(merchantId));\n}\n\nexport function getOpportunities(merchantId: string): Promise<Opportunity[]> {\n''',
          )
          replace_once(
              'frontend/lib/constants.ts',
              '  overview: (merchantId: string) => `/api/v1/merchants/${merchantId}/overview`,\n',
              '  overview: (merchantId: string) => `/api/v1/merchants/${merchantId}/overview`,\n'
              '  intelligence: (merchantId: string) =>\n'
              '    `/api/v1/merchants/${merchantId}/intelligence`,\n',
          )
          replace_once(
              'frontend/components/top-nav.tsx',
              '  { href: "/overview", label: "Overview" },\n  { href: "/autopilot", label: "Autopilot" },\n',
              '  { href: "/overview", label: "Overview" },\n  { href: "/intelligence", label: "Intelligence" },\n  { href: "/autopilot", label: "Autopilot" },\n',
          )

          # -----------------------------------------------------------------
          # Frontend page and view
          # -----------------------------------------------------------------
          page = Path('frontend/app/intelligence/page.tsx')
          page.parent.mkdir(parents=True, exist_ok=True)
          page.write_text('''import { MerchantIntelligenceView } from "@/components/merchant-intelligence-view";\nimport { InlineError } from "@/components/inline-error";\nimport { PageHeader } from "@/components/page-header";\nimport { RetryRefresh } from "@/components/retry-refresh";\nimport { getMerchantIntelligence } from "@/lib/api";\nimport { MERCHANT_ID, MERCHANT_NAME } from "@/lib/constants";\nimport { describeApiError } from "@/lib/errors";\n\nexport const dynamic = "force-dynamic";\n\nexport default async function IntelligencePage() {\n  try {\n    const intelligence = await getMerchantIntelligence(MERCHANT_ID);\n    return (\n      <>\n        <PageHeader\n          title="Merchant Intelligence"\n          subtitle={`${intelligence.merchant.name || MERCHANT_NAME} · Persisted optimization learning`}\n          meta={`Champion v${intelligence.champion.version}`}\n        />\n        <MerchantIntelligenceView intelligence={intelligence} />\n      </>\n    );\n  } catch (caught) {\n    return (\n      <>\n        <PageHeader\n          title="Merchant Intelligence"\n          subtitle={`${MERCHANT_NAME} · Persisted optimization learning`}\n        />\n        <InlineError error={describeApiError(caught)} className="max-w-2xl" />\n        <div className="mt-4">\n          <RetryRefresh />\n        </div>\n      </>\n    );\n  }\n}\n''')

          view = Path('frontend/components/merchant-intelligence-view.tsx')
          view.write_text('''import Link from "next/link";\nimport {\n  formatInrPaise,\n  formatInt,\n  formatPp,\n  formatPValue,\n  formatPercent,\n  formatUtcShort,\n  humanizeToken,\n  shortId,\n} from "@/lib/format";\nimport type { MerchantIntelligence } from "@/lib/types";\n\nexport function MerchantIntelligenceView({\n  intelligence,\n}: {\n  intelligence: MerchantIntelligence;\n}) {\n  const { portfolio, champion, memory } = intelligence;\n\n  return (\n    <div className="space-y-5">\n      <section\n        aria-label="Merchant intelligence summary"\n        className="grid grid-cols-2 gap-px overflow-hidden rounded-lg border border-gray-200 bg-gray-100 lg:grid-cols-4"\n      >\n        <SummaryCell label="Current Champion" value={`v${champion.version}`} sub={`${formatInt(champion.promotion_count)} promoted treatment${champion.promotion_count === 1 ? "" : "s"}`} />\n        <SummaryCell label="Terminal Trials" value={formatInt(memory.trial_count)} sub={`${formatInt(memory.completed_result_count)} statistical result${memory.completed_result_count === 1 ? "" : "s"}`} />\n        <SummaryCell label="Kept Treatments" value={formatInt(memory.keep_count)} sub={`${formatInt(memory.rollback_count)} rollback · ${formatInt(memory.inconclusive_count)} inconclusive`} />\n        <SummaryCell label="Policy Rejections" value={formatInt(memory.policy_rejection_count)} sub="Deterministic merchant guardrails" />\n      </section>\n\n      <section className="rounded-lg border border-gray-200 bg-white">\n        <SectionHeader\n          eyebrow="Next best action"\n          title="Opportunity Portfolio"\n          description="Task 19B ranks untouched detected opportunities using observed conversion gaps, captured order value, prior terminal trials, and merchant policy feasibility."\n        />\n        {portfolio.opportunities.length === 0 ? (\n          <EmptyState text="No untouched active opportunity is currently available for portfolio ranking." />\n        ) : (\n          <div className="overflow-x-auto">\n            <table className="w-full min-w-[920px] text-left text-[13px]">\n              <thead className="border-y border-gray-100 bg-gray-50 text-[11px] uppercase tracking-wide text-gray-500">\n                <tr>\n                  <th className="px-5 py-2.5 font-semibold">Rank</th>\n                  <th className="px-3 py-2.5 font-semibold">Segment</th>\n                  <th className="px-3 py-2.5 font-semibold">Observed gap</th>\n                  <th className="px-3 py-2.5 font-semibold">GMV sizing proxy</th>\n                  <th className="px-3 py-2.5 font-semibold">Prior trials</th>\n                  <th className="px-3 py-2.5 font-semibold">Untried allowed</th>\n                  <th className="px-5 py-2.5 font-semibold">Priority</th>\n                </tr>\n              </thead>\n              <tbody className="divide-y divide-gray-100">\n                {portfolio.opportunities.map((row) => {\n                  const next = row.opportunity_id === portfolio.next_best_opportunity_id;\n                  return (\n                    <tr key={row.opportunity_id} className={next ? "bg-indigo-50/40" : ""}>\n                      <td className="px-5 py-3 font-semibold text-gray-900">\n                        #{row.rank}\n                        {next && <span className="ml-2 rounded bg-indigo-100 px-1.5 py-0.5 text-[10px] font-semibold uppercase tracking-wide text-indigo-700">Next</span>}\n                      </td>\n                      <td className="px-3 py-3">\n                        <Link href={`/autopilot/${row.opportunity_id}`} className="font-medium text-gray-900 hover:text-indigo-700">\n                          {row.segment}\n                        </Link>\n                        <div className="mt-0.5 text-[11px] text-gray-400">{shortId(row.opportunity_id)}</div>\n                      </td>\n                      <td className="px-3 py-3 font-medium text-gray-800">{formatPp(row.conversion_gap)}</td>\n                      <td className="px-3 py-3 text-gray-700">{formatInrPaise(row.history_adjusted_gmv_proxy_paise)}</td>\n                      <td className="px-3 py-3 text-gray-700">{formatInt(row.prior_terminal_trials)}</td>\n                      <td className="px-3 py-3 text-gray-600">{row.untried_allowed_interventions.length ? row.untried_allowed_interventions.map(humanizeToken).join(", ") : "None"}</td>\n                      <td className="px-5 py-3">\n                        <div className="flex items-center gap-2">\n                          <div className="h-1.5 w-20 overflow-hidden rounded-full bg-gray-100">\n                            <div className="h-full rounded-full bg-indigo-600" style={{ width: `${Math.max(0, Math.min(100, row.priority_index * 100))}%` }} />\n                          </div>\n                          <span className="text-[12px] font-medium text-gray-700">{formatPercent(row.priority_index, 0)}</span>\n                        </div>\n                      </td>\n                    </tr>\n                  );\n                })}\n              </tbody>\n            </table>\n          </div>\n        )}\n        <div className="border-t border-gray-100 px-5 py-3 text-[11.5px] leading-5 text-gray-500">\n          GMV sizing proxy is an observed opportunity-sizing heuristic from Task 19B, not a forecast, booked revenue, or causal claim.\n        </div>\n      </section>\n\n      <section className="rounded-lg border border-gray-200 bg-white">\n        <SectionHeader\n          eyebrow="Champion–challenger"\n          title={`Champion v${champion.version}`}\n          description="Only statistically significant KEEP decisions promote a treatment. Future challengers use the promoted configuration as their control for the same intervention type."\n        />\n        {champion.configs.length === 0 ? (\n          <EmptyState text="Baseline configuration remains the champion. No treatment has earned a KEEP promotion yet." />\n        ) : (\n          <div className="grid gap-3 p-5 md:grid-cols-2">\n            {champion.configs.map((config) => (\n              <article key={config.intervention_type} className="rounded-lg border border-gray-200 p-4">\n                <div className="flex items-start justify-between gap-3">\n                  <div>\n                    <div className="text-[11px] font-semibold uppercase tracking-wide text-gray-400">Promoted control</div>\n                    <h3 className="mt-1 text-[14px] font-semibold text-gray-900">{humanizeToken(config.intervention_type)}</h3>\n                  </div>\n                  <span className="rounded bg-emerald-50 px-2 py-1 text-[10px] font-semibold uppercase tracking-wide text-emerald-700">KEEP</span>\n                </div>\n                <div className="mt-3 flex flex-wrap gap-1.5">{configChips(config.config)}</div>\n                <dl className="mt-4 grid grid-cols-3 gap-3 border-t border-gray-100 pt-3">\n                  <Stat label="Lift" value={formatPp(config.absolute_lift)} />\n                  <Stat label="p-value" value={formatPValue(config.p_value)} />\n                  <Stat label="Promoted" value={formatUtcShort(config.promoted_at)} />\n                </dl>\n                <Link href={`/autopilot/${config.source_experiment_id}`} className="mt-3 block text-[11.5px] text-indigo-600 hover:text-indigo-800">\n                  Source experiment {shortId(config.source_experiment_id)}\n                </Link>\n              </article>\n            ))}\n          </div>\n        )}\n      </section>\n\n      <section className="rounded-lg border border-gray-200 bg-white">\n        <SectionHeader\n          eyebrow="Experiment memory"\n          title="Learned Intervention History"\n          description="Terminal experiments are grouped by segment and intervention. Active work is excluded until it reaches a safe terminal boundary."\n        />\n        {memory.knowledge.length === 0 ? (\n          <EmptyState text="No terminal experiment history has been learned yet." />\n        ) : (\n          <div className="overflow-x-auto">\n            <table className="w-full min-w-[860px] text-left text-[13px]">\n              <thead className="border-y border-gray-100 bg-gray-50 text-[11px] uppercase tracking-wide text-gray-500">\n                <tr>\n                  <th className="px-5 py-2.5 font-semibold">Segment</th>\n                  <th className="px-3 py-2.5 font-semibold">Intervention</th>\n                  <th className="px-3 py-2.5 font-semibold">Trials</th>\n                  <th className="px-3 py-2.5 font-semibold">KEEP</th>\n                  <th className="px-3 py-2.5 font-semibold">Rollback</th>\n                  <th className="px-3 py-2.5 font-semibold">Inconclusive</th>\n                  <th className="px-3 py-2.5 font-semibold">Rejected</th>\n                  <th className="px-5 py-2.5 font-semibold">Latest observed lift</th>\n                </tr>\n              </thead>\n              <tbody className="divide-y divide-gray-100">\n                {memory.knowledge.map((row) => (\n                  <tr key={`${row.segment}:${row.intervention_type}`}>\n                    <td className="px-5 py-3 font-medium text-gray-900">{row.segment}</td>\n                    <td className="px-3 py-3 text-gray-700">{humanizeToken(row.intervention_type)}</td>\n                    <td className="px-3 py-3 text-gray-700">{formatInt(row.trial_count)}</td>\n                    <td className="px-3 py-3 text-emerald-700">{formatInt(row.keep_count)}</td>\n                    <td className="px-3 py-3 text-rose-700">{formatInt(row.rollback_count)}</td>\n                    <td className="px-3 py-3 text-amber-700">{formatInt(row.inconclusive_count)}</td>\n                    <td className="px-3 py-3 text-gray-700">{formatInt(row.rejected_count)}</td>\n                    <td className="px-5 py-3 font-medium text-gray-800">{formatPp(row.latest_absolute_lift)}</td>\n                  </tr>\n                ))}\n              </tbody>\n            </table>\n          </div>\n        )}\n      </section>\n\n      <section className="rounded-lg border border-gray-200 bg-white">\n        <SectionHeader\n          eyebrow="Persisted outcomes"\n          title="Recent Terminal Trials"\n          description="Newest first. These rows are read from persisted policy and statistical decisions; the LLM does not label experiment outcomes."\n        />\n        {memory.records.length === 0 ? (\n          <EmptyState text="No terminal trial records are available." />\n        ) : (\n          <div className="divide-y divide-gray-100">\n            {memory.records.slice(0, 8).map((record) => (\n              <div key={record.experiment_id} className="grid gap-2 px-5 py-3.5 md:grid-cols-[1.4fr_1.3fr_1fr_1fr_auto] md:items-center">\n                <div>\n                  <div className="text-[13px] font-medium text-gray-900">{record.segment}</div>\n                  <div className="text-[11px] text-gray-400">{shortId(record.experiment_id)} · {formatUtcShort(record.ended_at ?? record.created_at)}</div>\n                </div>\n                <div className="text-[12.5px] text-gray-700">{humanizeToken(record.intervention_type)}</div>\n                <div className="text-[12px] text-gray-600">Policy {record.policy_decision ?? "-"}</div>\n                <div className="text-[12px] font-medium text-gray-800">{record.statistical_decision ?? humanizeToken(record.terminal_reason)}</div>\n                <div className="text-right text-[12px] font-semibold text-gray-800">{formatPp(record.absolute_lift)}</div>\n              </div>\n            ))}\n          </div>\n        )}\n      </section>\n    </div>\n  );\n}\n\nfunction SummaryCell({ label, value, sub }: { label: string; value: string; sub: string }) {\n  return (\n    <div className="bg-white px-4 py-4">\n      <div className="text-[11px] font-semibold uppercase tracking-wide text-gray-400">{label}</div>\n      <div className="mt-1 text-[22px] font-semibold tracking-tight text-gray-900">{value}</div>\n      <div className="mt-1 text-[11.5px] text-gray-500">{sub}</div>\n    </div>\n  );\n}\n\nfunction SectionHeader({ eyebrow, title, description }: { eyebrow: string; title: string; description: string }) {\n  return (\n    <div className="px-5 py-4">\n      <div className="text-[10.5px] font-semibold uppercase tracking-[0.14em] text-indigo-600">{eyebrow}</div>\n      <h2 className="mt-1 text-[16px] font-semibold tracking-tight text-gray-900">{title}</h2>\n      <p className="mt-1 max-w-4xl text-[12.5px] leading-5 text-gray-500">{description}</p>\n    </div>\n  );\n}\n\nfunction EmptyState({ text }: { text: string }) {\n  return <div className="border-t border-gray-100 px-5 py-8 text-[13px] text-gray-500">{text}</div>;\n}\n\nfunction Stat({ label, value }: { label: string; value: string }) {\n  return (\n    <div>\n      <dt className="text-[10px] uppercase tracking-wide text-gray-400">{label}</dt>\n      <dd className="mt-1 text-[12px] font-medium text-gray-800">{value}</dd>\n    </div>\n  );\n}\n\nfunction configChips(config: Record<string, unknown>) {\n  const entries = Object.entries(config);\n  if (entries.length === 0) return <span className="text-[12px] text-gray-400">Baseline config</span>;\n  return entries.map(([key, value]) => (\n    <span key={key} className="rounded border border-gray-200 bg-gray-50 px-2 py-1 text-[11px] text-gray-700">\n      {humanizeToken(key)}: {configValue(key, value)}\n    </span>\n  ));\n}\n\nfunction configValue(key: string, value: unknown): string {\n  if (typeof value === "boolean") return value ? "Enabled" : "Disabled";\n  if (typeof value === "number") {\n    if (key.endsWith("_pct")) return formatPercent(value, 0);\n    if (key.endsWith("_hours")) return `${value}h`;\n    return String(value);\n  }\n  if (value == null) return "None";\n  return String(value);\n}\n''')

