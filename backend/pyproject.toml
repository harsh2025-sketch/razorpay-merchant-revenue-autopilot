[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "merchant-revenue-autopilot-backend"
version = "0.1.0"
description = "FastAPI backend for the Merchant Revenue Autopilot."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141,<1.0",
    "httpx>=0.28,<1.0",
    "pydantic>=2.13,<3.0",
    "pydantic-settings>=2.15,<3.0",
    "python-multipart>=0.0.20,<1.0",
    "uvicorn>=0.52,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "openai>=1.100,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
